version: "3"

vars:
  SCRIPT: "regression.R"
  MARKDOWN: "docs/memo.md"
  DOCX: "docs/memo.docx"

tasks:
  format:
    desc: Format R code using styler
    cmds:
      - Rscript -e "styler::style_dir('.')"

  lint:
    desc: Lint R code using lintr
    cmds:
      - Rscript -e "lintr::lint_dir('.')"

  run:
    desc: Run the main R script
    cmds:
      - Rscript "{{.SCRIPT}}"

  docx:
    desc: Convert a Markdown file to a Word document with pandoc
    cmds:
      - pandoc --resource-path="$(dirname "{{.MARKDOWN}}"):." "{{.MARKDOWN}}" -o "{{.DOCX}}"

  all:
    desc: Format, lint, and run
    deps:
      - format
      - lint
      - run
